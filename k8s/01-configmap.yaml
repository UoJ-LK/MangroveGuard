# Non-secret server settings. Loaded into the server pod with envFrom.
# Secrets (MONGO_URI, JWT_SECRET, EMAIL_USER, EMAIL_PASS) live in
# mangrove-guard-secret - see secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mangrove-guard-config
  namespace: webapps-mangrove-guard
data:
  NODE_ENV: "production"
  PORT: "5000"
  HOST: "0.0.0.0"

  # Public URL of the web app, including the sub-path. Used for CORS and for
  # the links in approval / password-reset emails.
  CLIENT_URL: "https://www.webapps.jfn.ac.lk/mangrove-guard"

  JWT_EXPIRE: "7d"

  # Email via Gmail SMTP. EMAIL_USER (the Gmail address) and EMAIL_PASS (a
  # Google App Password, not the account password) are in the secret; sending
  # stays in log-only mode until both are set.
  #
  # Host + port 587 (STARTTLS) rather than EMAIL_SERVICE "gmail": the "gmail"
  # preset uses port 465, which the cluster's egress has blocked before (see
  # the MyUoJ auth service). Leave EMAIL_SERVICE empty - when set it overrides
  # EMAIL_HOST/PORT.
  EMAIL_SERVICE: ""
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  # Gmail rewrites From to the authenticated account unless the address is a
  # verified "Send mail as" alias, so keep this the same as EMAIL_USER.
  EMAIL_FROM: '"Mangrove Admin" <mangroveguard.team@gmail.com>'
  EMAIL_COOLDOWN_MINUTES: "30"

  SMS_COOLDOWN_MINUTES: "30"
  # WATCHDOG_CHECK_INTERVAL_MS: "60000"
